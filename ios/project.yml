name: CSMSSurvey

options:
  bundleIdPrefix: com.digitalsupportsystems
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  xcodeVersion: "15.0"

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Debug.xcconfig
  Release: Release.xcconfig

targets:
  CSMSSurvey:
    type: application
    platform: iOS
    sources:
      - path: CSMSSurvey
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.digitalsupportsystems.CSMSSurvey
        SWIFT_VERSION: "5.9"
        INFOPLIST_FILE: CSMSSurvey/Resources/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ""   # Set to your Apple Team ID
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Inject API config and CLAUDE_API_KEY from xcconfig into Info.plist
        API_BASE_SCHEME: "$(API_BASE_SCHEME)"
        API_BASE_HOST: "$(API_BASE_HOST)"
        CLAUDE_API_KEY: "$(CLAUDE_API_KEY)"
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    info:
      path: CSMSSurvey/Resources/Info.plist
      properties:
        CFBundleName: CSMS Survey
        CFBundleDisplayName: CSMS Survey
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        API_BASE_SCHEME: "$(API_BASE_SCHEME)"
        API_BASE_HOST: "$(API_BASE_HOST)"
        CLAUDE_API_KEY: "$(CLAUDE_API_KEY)"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: YES
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "CSMS Survey uses your microphone to listen for hands-free voice commands during surveys."
        NSSpeechRecognitionUsageDescription: "CSMS Survey uses speech recognition to convert voice commands into survey actions."
        NSCameraUsageDescription: "CSMS Survey uses your camera to capture location photos during a survey walk."
        NSPhotoLibraryAddUsageDescription: "CSMS Survey can save captured photos to your photo library."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true   # Allows HTTP for local dev; tighten for production
